<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Not found - Daily morning brief</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fbfaf8;
  --surface: #ffffff;
  --text: #1c1b19;
  --muted: #6b6862;
  --rule: #e5e2dc;
  --link: #1a5f4a;
  --accent: #0f4c3a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a;
    --surface: #1d1f23;
    --text: #e8e6e3;
    --muted: #9a968f;
    --rule: #2e3138;
    --link: #6fcfae;
    --accent: #6fcfae;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0 20px 64px;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
        "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 44rem; margin: 0 auto; }
header.masthead {
  padding: 40px 0 20px;
  border-bottom: 2px solid var(--rule);
  margin-bottom: 32px;
}
.kicker {
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 6px;
}
h1 { font-size: 1.7rem; line-height: 1.25; margin: 0; letter-spacing: -.01em; }
h2 {
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 40px 0 4px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
}
p { margin: 18px 0; }
a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
strong a { text-decoration: none; }
strong a:hover { text-decoration: underline; }
.quiet { color: var(--muted); font-style: italic; }
.archive { margin-top: 64px; padding-top: 24px; border-top: 2px solid var(--rule); }
.archive ul { list-style: none; padding: 0; margin: 16px 0 0; }
.archive li { padding: 7px 0; border-bottom: 1px solid var(--rule); }
.archive a { text-decoration: none; }
.archive a:hover { text-decoration: underline; }
.back { display: inline-block; margin: 0 0 24px; font-size: 14px; text-decoration: none; }
footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--rule);
         color: var(--muted); font-size: 13px; }
@media (max-width: 480px) {
  body { font-size: 16px; padding: 0 16px 48px; }
  h1 { font-size: 1.4rem; }
}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead"><p class="kicker">404</p><h1>Not found</h1></header><p class="quiet">No brief at that address.</p><p><a href="./">Go to the latest brief</a></p>
<footer>Generated automatically each morning.</footer>
</div>
</body>
</html>
